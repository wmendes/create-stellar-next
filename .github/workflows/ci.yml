name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: the contract loop against the public testnet.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/bin.js --version
      - run: npm run scan:secrets

  project-e2e:
    name: project e2e (${{ matrix.os }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e

  contract-e2e:
    # Hosted macOS and Windows runners have no Docker, so the local-network loop runs on Linux.
    name: contract e2e (${{ github.event_name == 'schedule' && 'testnet' || 'local network' }})
    needs: gates
    runs-on: ubuntu-latest
    env:
      E2E_NETWORK: ${{ github.event_name == 'schedule' && 'testnet' || 'local' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Rust from rust-toolchain.toml, as the default toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target wasm32v1-none
          rustup default "$toolchain"
      - uses: stellar/stellar-cli@f2a7b74175c34585f3b30a1abf42a2d41cbcc390 # v30.0.1
        with:
          version: "30.0.1"
      - run: test "$(stellar --version | head -1 | cut -d' ' -f2)" = "$(cat .stellar-cli-version)"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:docs
      - run: npm run test:e2e:contracts
